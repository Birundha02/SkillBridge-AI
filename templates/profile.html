<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Profile | SkillBridge AI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            SkillBridge <span>AI</span>
        </div>

        <a href="/" class="back-link">← Back to Home</a>

    </nav>


    <section class="profile-page">

        <div class="profile-container">

            <div class="profile-header">

                <p class="section-tag">STEP 1 OF 3</p>

                <h1>Tell us about yourself.</h1>

                <p>
                    Help SkillBridge AI understand your skills and career goals.
                </p>

            </div>


            <!-- IMPORTANT: method and action -->
            <form class="profile-form" action="/profile" method="POST">


                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Highest Education</label>

                    <select name="education" required>

                        <option value="">Select your education</option>
                        <option>B.E / B.Tech</option>
                        <option>B.Sc</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>Diploma</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Experience Level</label>

                    <select name="experience">

                        <option>Fresher</option>
                        <option>0–1 Years</option>
                        <option>1–3 Years</option>
                        <option>3+ Years</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Your Skills</label>

                    <input
                        type="text"
                        name="skills"
                        placeholder="Example: Python, Java, SQL, HTML"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Career Interest</label>

                    <select name="career_interest">

                        <option>Software Development</option>
                        <option>Data Science</option>
                        <option>Web Development</option>
                        <option>Cybersecurity</option>
                        <option>Cloud Computing</option>

                    </select>

                </div>


                <button type="submit" class="primary-btn continue-btn">

                    Continue to Skill Assessment →

                </button>

            </form>

        </div>

    </section>

</body>

</html>
