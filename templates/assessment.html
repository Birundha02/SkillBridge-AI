<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skill Assessment | SkillBridge AI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            SkillBridge <span>AI</span>
        </div>

        <a href="/profile" class="back-link">
            ← Back to Profile
        </a>
    </nav>


    <section class="assessment-page">

        <div class="assessment-container">

            <div class="assessment-header">

                <p class="section-tag">
                    STEP 2 OF 3
                </p>

                <h1>
                    Discover Your Skill Strengths.
                </h1>

                <p>
                    Assessment for {{ career_interest }}
                </p>

            </div>


            <form action="/results" method="POST">

                {% for question in questions %}

                {% set question_number = loop.index %}

                <div class="question-card">

                    <span class="question-number">
                        {{ question_number }}
                    </span>

                    <h3>
                        {{ question.question }}
                    </h3>

                    <div class="options">

                        {% for option in question.options %}

                        <label class="option">

                            <input
                                type="radio"
                                name="q{{ question_number }}"
                                value="{{ 'correct' if option == question.answer else 'wrong' }}"
                                required
                            >

                            {{ option }}

                        </label>

                        {% endfor %}

                    </div>

                </div>

                {% endfor %}


                <button
                    type="submit"
                    class="primary-btn assessment-btn"
                >
                    Analyze My Skills →
                </button>

            </form>

        </div>

    </section>

</body>

</html>
